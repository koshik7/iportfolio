function refresh(){sync();if(!$('modal').classList.contains('open')||!curV)return;if(curV.id==='admin')adminUI();else{$('mb').innerHTML=VIEW[curV.id]();if(curV.id==='certs')cfilter()}}
async function cloud(){try{if(!window.claude||!claude.use)return;$('adm').style.display='';DB=await claude.use('db');if(!DB)return;AS=await claude.use('assets');DB.doc('site/about').onSnapshot(s=>{if(s.exists){Object.assign(C.about,s.data());refresh()}},()=>{});for(const k of['certs','miles','links'])DB.collection(k).orderBy('o').onSnapshot(s=>{if(s.size||seen[k]){seen[k]=1;C[k]=s.docs.map(d=>({...d.data(),id:d.id}));refresh()}},()=>{})}catch(e){}}
function ctile(c){return `<div class="t s2">${c.img?`<img loading="lazy" src="${c.img}" alt="">`:'<div class="ph">Add certificate image</div>'}<h4>${E(c.t)}</h4><p>${E(c.i)} ${E(c.y)}</p></div>`}
function cfilter(more){if(more)CP+=24;const q=($('cqi')?$('cqi').value:'').toLowerCase(),L=D.certs.filter(c=>(c.t+c.i).toLowerCase().includes(q));$('cg').innerHTML=L.slice(0,CP).map(ctile).join('')+(L.length>CP?`<div class="t s4"><button class="go" onclick="cfilter(1)">Show more (${L.length-CP})</button></div>`:'')}
async function openAdmin(){locked=true;curV={id:'admin'};$('modal').classList.add('open');$('mb').innerHTML='<h2>Admin</h2><p>Checking sign-in...</p>';try{const u=window.claude&&await claude.use('user');OWNER=!!u&&await u.isOwner();if(OWNER){const m=await u.me();ME=m.email||m.name||''}}catch(e){OWNER=false}adminUI()}
const er=e=>toast('Save failed: '+((e&&(e.message||e.code))||'error'));
function upd(k,id,f,v){DB.collection(k).doc(id).update({[f]:v}).catch(er)}
function del(k,id,aid){if(!confirm('Delete this item?'))return;DB.collection(k).doc(id).delete().then(()=>aid&&AS&&AS.delete(aid)).catch(er)}
async function addItem(k){const a=$('a1').value.trim(),b=$('a2')?$('a2').value.trim():'';if(!a)return;try{await DB.collection(k).add(k==='miles'?{t:a,o:Date.now()}:{n:a,u:b||'#',o:Date.now()})}catch(e){er(e)}}
async function saveAbout(){try{await DB.doc('site/about').set({name:$('f1').value,role:$('f2').value,bio:$('f3').value,now:$('f4').value});toast('About Me saved')}catch(e){er(e)}}
async function upCerts(inp){const fs=[...inp.files],st=$('ust');if(!AS){st.textContent='Uploads are unavailable here.';return}let n=0;for(const f of fs){st.textContent='Uploading '+(++n)+' of '+fs.length+': '+f.name;try{const r=await AS.upload(f);await DB.collection('certs').add({t:f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' '),i:'',y:'',img:r.url,aid:r.id,o:Date.now()+n})}catch(e){st.textContent='Failed on '+f.name+': '+((e&&(e.message||e.code))||'error');return}}st.textContent='Uploaded '+fs.length+' files'}
const fi=(id,v,ph)=>`<input id="${id}" value="${E(v)}" placeholder="${ph}">`,rowS='display:flex;gap:6px;align-items:center;margin:6px 0',gx=(k,id,aid)=>`<button class="go" onclick="del('${k}','${id}','${aid||''}')">X</button>`;
const AD={
about:()=>`<div class="t s4">${fi('f1',C.about.name,'Name')}${fi('f2',C.about.role,'Role')}<textarea id="f3" rows="5" placeholder="Bio">${E(C.about.bio)}</textarea>${fi('f4',C.about.now,'What you are doing now')}<button class="go" onclick="saveAbout()">Save About Me</button></div>`,
certs:()=>{const L=C.certs.filter(c=>!c.s&&(c.t+(c.i||'')).toLowerCase().includes(AQ.toLowerCase()));return `<div class="t s4"><h4>Upload certificate images</h4><p>Pick many images at once (JPG, PNG or WebP, up to 20 MB each). Titles come from file names; edit them below.</p><input type="file" multiple accept="image/*" onchange="upCerts(this)"><p id="ust"></p></div><div class="t s4"><h4>${L.length} saved certificates</h4><input placeholder="Search" value="${E(AQ)}" onchange="AQ=this.value;adminUI()">${L.slice(0,40).map(c=>`<div style="${rowS}"><img src="${c.img}" style="width:44px;height:44px;margin:0;flex:none"><input style="flex:1;min-width:0" value="${E(c.t)}" onchange="upd('certs','${c.id}','t',this.value)"><input style="width:28%" value="${E(c.i)}" placeholder="Issuer" onchange="upd('certs','${c.id}','i',this.value)"><input style="width:64px" value="${E(c.y)}" placeholder="Year" onchange="upd('certs','${c.id}','y',this.value)">${gx('certs',c.id,c.aid)}</div>`).join('')}${L.length>40?'<p>Showing 40. Use search to find others.</p>':''}</div>`},
miles:()=>`<div class="t s4"><h4>Add achievement</h4>${fi('a1','','e.g. 2026: Won a national hackathon')}<button class="go" onclick="addItem('miles')">Add</button></div><div class="t s4">${C.miles.filter(m=>!m.s).map(m=>`<div style="${rowS}"><input style="flex:1;min-width:0" value="${E(m.t)}" onchange="upd('miles','${m.id}','t',this.value)">${gx('miles',m.id)}</div>`).join('')||'<p>Nothing saved yet. Visitors see sample text until you add one.</p>'}</div>`,
links:()=>`<div class="t s4"><h4>Add link</h4>${fi('a1','','Label, e.g. Instagram')}${fi('a2','','https://...')}<button class="go" onclick="addItem('links')">Add</button></div><div class="t s4">${C.links.filter(l=>!l.s).map(l=>`<div style="${rowS}"><input style="width:34%" value="${E(l.n)}" onchange="upd('links','${l.id}','n',this.value)"><input style="flex:1;min-width:0" value="${E(l.u)}" onchange="upd('links','${l.id}','u',this.value)">${gx('links',l.id)}</div>`).join('')||'<p>Nothing saved yet. Visitors see sample links until you add one.</p>'}</div>`};
function adminUI(){const m=$('mb');if(!DB||!OWNER){m.innerHTML='<h2>Admin</h2><div class="bento"><div class="t s4"><h4>Owner sign-in needed</h4><p>Open this page while signed in to claude.ai as its owner to edit content. Visitors cannot change anything.</p></div></div>';return}m.innerHTML=`<h2>Admin</h2><p>Signed in as ${E(ME||'owner')}</p>${[['about','About me'],['certs','Certificates'],['miles','Achievements'],['links','Connect']].map(([k,n])=>`<button class="go" style="margin:2px;opacity:${tab===k?1:.5}" onclick="tab='${k}';adminUI()">${n}</button>`).join('')}<div class="bento" style="margin-top:10px">${AD[tab]()}</div>`}
/* map */
function drawMap(c,S,big){c.clearRect(0,0,S,S);const k=S/2*.92/52,cx=S/2;c.save();c.beginPath();c.arc(cx,cx,cx,0,7);c.clip();c.fillStyle='#38b6ff';c.fillRect(0,0,S,S);c.fillStyle='#f3dc8a';c.beginPath();c.arc(cx,cx,48*k,0,7);c.fill();c.fillStyle='#7bd957';c.beginPath();c.arc(cx,cx,44*k,0,7);c.fill();
for(const h of HILLS){c.fillStyle='#a9e86a';c.beginPath();c.arc(cx+h[0]*k,cx+h[1]*k,h[2]*k*.8,0,7);c.fill()}
for(const p of POIS){c.fillStyle=p.c;c.strokeStyle='#14122b';c.lineWidth=big?4:3;c.beginPath();c.arc(cx+p.x*k,cx+p.z*k,big?13:9,0,7);c.fill();c.stroke();if(big){c.fillStyle='#14122b';c.font='22px "Lilita One",sans-serif';c.textAlign='center';c.fillText(p.n,cx+p.x*k,cx+p.z*k-20)}}
c.translate(cx+P.x*k,cx+P.z*k);c.rotate(-P.face);c.fillStyle='#fff';c.strokeStyle='#14122b';c.lineWidth=3;c.beginPath();c.moveTo(0,big?14:10);c.lineTo(big?-10:-7,big?-10:-8);c.lineTo(big?10:7,big?-10:-8);c.closePath();c.fill();c.stroke();c.restore()}
function toggleMap(){const m=$('map');if(m.classList.contains('on')){m.classList.remove('on');locked=false}else if(!locked){m.classList.add('on');locked=true;drawMap($('mc').getContext('2d'),640,true)}}
$('mm').onclick=toggleMap;$('map').addEventListener('pointerdown',e=>{if(e.target===$('map'))toggleMap()});
$('mc').addEventListener('click',e=>{const r=$('mc').getBoundingClientRect(),s=640/r.width,x=(e.clientX-r.left)*s,y=(e.clientY-r.top)*s,k=320*.92/52;const p=POIS.find(p=>Math.hypot(320+p.x*k-x,320+p.z*k-y)<28);if(p)teleport(p)});
POIS.forEach(p=>{const b=document.createElement('button');b.textContent=p.n;b.style.background=p.c;b.onclick=()=>teleport(p);$('tp').appendChild(b)});
/* teleport */
const beam=new THREE.Mesh(new THREE.CylinderGeometry(1.4,1.4,70,16,1,true),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,side:2}));beam.position.y=30;scene.add(beam);
function teleport(p){$('map').classList.remove('on');const d=Math.hypot(p.x,p.z)||1,tx=p.x-p.x/d*10,tz=p.z-p.z/d*10;tp={t:0,tx:clamp(tx,-40,40),tz:clamp(tz,-40,40),moved:false,c:p.c};beam.material.color.set(p.c);locked=true;$('flash').style.opacity=0}
/* physics */
function collide(){for(const b of boxes){const cx=clamp(P.x,b.x-b.w,b.x+b.w),cz=clamp(P.z,b.z-b.d,b.z+b.d);let dx=P.x-cx,dz=P.z-cz,d=Math.hypot(dx,dz);if(d<.55){if(d>1e-4){P.x=cx+dx/d*.55;P.z=cz+dz/d*.55}else P.x=b.x+(P.x<b.x?-b.w-.55:b.w+.55)}}
for(const c of circles){const dx=P.x-c.x,dz=P.z-c.z,d=Math.hypot(dx,dz),m=c.r+.5;if(d<m&&d>1e-4){P.x=c.x+dx/d*m;P.z=c.z+dz/d*m}}const r=Math.hypot(P.x,P.z);if(r>46){P.x*=46/r;P.z*=46/r}}
/* loop */
let last=performance.now(),acc=0;const CAP=LOW?30:60;
function frame(now){requestAnimationFrame(frame);const dt0=Math.min((now-last)/1000,.1);last=now;acc+=dt0;if(acc<1/CAP-.003)return;const dt=acc;acc=0;T+=dt;
let ix=(keys.d||keys.right?1:0)-(keys.a||keys.left?1:0)+joy.x,iy=(keys.w||keys.up?1:0)-(keys.s||keys.down?1:0)+joy.y;if(locked){ix=iy=0}let m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m;m=1}
const fx=-Math.sin(yaw),fz=-Math.cos(yaw),dx=fx*iy-fz*ix,dz=fz*iy+fx*ix,sp=(keys.shift?4.5:8.5)*m,k=Math.min(1,dt*12);
P.vx+=(dx/(m||1)*sp-P.vx)*k;P.vz+=(dz/(m||1)*sp-P.vz)*k;if(m>0)P.vx=m?P.vx:0;P.x+=P.vx*dt;P.z+=P.vz*dt;
if(m>.05){const da=((Math.atan2(dx,dz)-P.face+9.42)%6.283)-3.1416;P.face+=da*Math.min(1,dt*14)}
if(keys.space&&!P.air&&!locked){P.vy=11;P.air=true}P.vy-=30*dt;P.y+=P.vy*dt;collide();const gy=H(P.x,P.z);if(P.y<=gy){P.y=gy;P.vy=0;P.air=false}else if(P.y>gy+.1)P.air=true;
spd=Math.hypot(P.vx,P.vz);const sn=clamp(spd/8.5,0,1);ph+=dt*(5+spd*1.1);const sw=Math.sin(ph)*clamp(spd/4,0,1)*(.6+sn*.5);
if(P.air){legL.rotation.x=.7;legR.rotation.x=-.4;armL.rotation.x=-2.4;armR.rotation.x=-2.2}else{legL.rotation.x=sw;legR.rotation.x=-sw;armL.rotation.x=-sw;armR.rotation.x=sw+(spd<.5?Math.sin(T*2)*.04:0)}
body.rotation.x=.18*sn;body.position.y=Math.abs(Math.sin(ph))*.07*sn+(spd<.5?Math.sin(T*2)*.015:0);
const hp=hg.attributes.position;for(let i=0;i<hp.count;i++){const x=hb[i*3],y=hb[i*3+1],w=(.7-y)/1.4;hp.setZ(i,-sn*.6*w*w-.05*w+Math.sin(T*9+y*5+x*3)*.07*w*(.25+sn)+(P.air?.3*w:0));hp.setX(i,x+Math.sin(T*6+y*4)*.04*w*sn)}hp.needsUpdate=true;
av.position.set(P.x,P.y,P.z);av.rotation.y=P.face;
/* teleport fx */
if(tp){tp.t+=dt;const t=tp.t;beam.position.x=tp.moved?tp.tx:P.x;beam.position.z=tp.moved?tp.tz:P.z;
if(!tp.moved){const a=clamp(t/.6,0,1);beam.material.opacity=a*.8;beam.scale.set(.3+a,1,.3+a);av.scale.setScalar(1-a*.9);$('flash').style.opacity=a>.7?1:0;
if(t>=.6){P.x=tp.tx;P.z=tp.tz;P.vx=P.vz=0;P.y=H(P.x,P.z);tp.moved=true;$('flash').style.opacity=0}}
else{const a=clamp((t-.6)/.8,0,1);beam.material.opacity=(1-a)*.8;beam.scale.set(1.3-a*.9,1,1.3-a*.9);av.scale.setScalar(.1+a*.9);if(a>=1){tp=null;beam.material.opacity=0;av.scale.setScalar(1);locked=false}}}
/* camera */
const cp=Math.cos(pitch),dist=9,rx=Math.cos(yaw),rz=-Math.sin(yaw),tx=P.x+rx*1,ty=P.y+2.1,tz=P.z+rz*1;
let cx=tx+Math.sin(yaw)*cp*dist,cy=ty+Math.sin(pitch)*dist,cz=tz+Math.cos(yaw)*cp*dist;cy=Math.max(cy,H(cx,cz)+.8);cam.position.lerp(new THREE.Vector3(cx,cy,cz),Math.min(1,dt*14));cam.lookAt(tx,ty,tz);cam.fov+=((58+sn*10)-cam.fov)*.1;cam.updateProjectionMatrix();
sun.position.set(P.x+30,50,P.z+20);sky.position.set(P.x,0,P.z);sun.target.position.set(P.x,0,P.z);
bob.forEach(f=>f());WF.forEach(f=>f());spin.forEach(o=>o.rotation.y=T*1.2);orbit.forEach(f=>f());POIS.forEach(p=>{p.ban.position.y=p.by+Math.sin(T*1.5+p.x)*.3});drops.forEach(d=>d.on&&(d.m.visible=d.b.visible=true));
/* interaction */
near=null;for(const p of POIS)if(Math.hypot(P.x-p.x,P.z-p.z)<9)near=p;const pr=$('prompt');if(near&&!locked){pr.style.display='block';$('pt').textContent=TOUCH?'Tap Interact: '+near.n:'Open '+near.n}else pr.style.display='none';
for(const d of drops)if(d.on&&Math.hypot(P.x-d.x,P.z-d.z)<2.2){d.on=false;d.m.visible=d.b.visible=false;toast(EGGS[egg++%EGGS.length])}
if(CMP)CMP.render();else R.render(scene,cam);if(((T*10)|0)%3===0)drawMap($('mm').getContext('2d'),264,false)}
cloud();requestAnimationFrame(frame);
</script></body></html>
